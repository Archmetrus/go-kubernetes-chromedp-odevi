apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: synthetictests.monitoring.k8s.io
spec:
  group: monitoring.k8s.io
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                url:
                  type: string
                schedule:
                  type: string
                intervalSeconds:
                  type: integer
                viewport:
                  type: object
                  properties:
                    width:
                      type: integer
                    height:
                      type: integer
                visualRegression:
                  type: boolean
                driftThreshold:
                  type: number
                webhookUrl:
                  type: string
                steps:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      action:
                        type: string
                      target:
                        type: string
                      value:
                        type: string
                      attribute:
                        type: string
                      timeoutSec:
                        type: integer
            status:
              type: object
              properties:
                phase:
                  type: string
                lastRunTime:
                  type: string
                visualDrift:
                  type: number
                lastErrorMessage:
                  type: string
  scope: Namespaced
  names:
    plural: synthetictests
    singular: synthetictest
    kind: SyntheticTest
    shortNames:
      - st
      - synth
