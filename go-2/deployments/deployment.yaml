apiVersion: apps/v1
kind: Deployment
metadata:
  name: k8s-chromedp-synthetics
  namespace: default
  labels:
    app: k8s-chromedp-synthetics
spec:
  replicas: 1
  selector:
    matchLabels:
      app: k8s-chromedp-synthetics
  template:
    metadata:
      labels:
        app: k8s-chromedp-synthetics
    spec:
      serviceAccountName: k8s-chromedp-synthetics-sa
      containers:
        - name: synthetics-app
          image: k8s-chromedp-synthetics:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "8080"
            - name: API_KEY
              value: "prod-secret-key-change-me"
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              memory: "512Mi"
              cpu: "250m"
            limits:
              memory: "2Gi"
              cpu: "1000m"
          readinessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: k8s-chromedp-synthetics
  namespace: default
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: k8s-chromedp-synthetics
