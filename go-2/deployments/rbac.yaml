apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-chromedp-synthetics-sa
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: k8s-chromedp-synthetics-role
rules:
  - apiGroups: ["monitoring.k8s.io"]
    resources: ["synthetictests", "synthetictests/status"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: k8s-chromedp-synthetics-binding
subjects:
  - kind: ServiceAccount
    name: k8s-chromedp-synthetics-sa
    namespace: default
roleRef:
  kind: ClusterRole
  name: k8s-chromedp-synthetics-role
  apiGroup: rbac.authorization.k8s.io
