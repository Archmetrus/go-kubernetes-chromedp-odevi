name: Build release image
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  release:
    needs: checks
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Image name
        id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ vars.APP_DIRECTORY || '.' }}
          file: ${{ vars.APP_DIRECTORY || '.' }}/deploy/gorev-atolyesi/Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.sha }}
          provenance: true
          sbom: true
      - uses: docker/build-push-action@v6
        with:
          context: ${{ vars.APP_DIRECTORY || '.' }}
          file: ${{ vars.APP_DIRECTORY || '.' }}/deploy/live/backup.Dockerfile
          push: true
          tags: ${{ steps.image.outputs.name }}-backup:${{ github.sha }}
