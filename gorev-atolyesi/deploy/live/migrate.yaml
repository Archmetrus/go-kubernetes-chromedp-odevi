apiVersion: batch/v1
kind: Job
metadata:
  name: gorev-migrate-RELEASE_VERSION
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 86400
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: migrate
          image: APP_IMAGE
          args: [migrate]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: gorev-secrets, key: DATABASE_URL}
          resources:
            requests: {cpu: 100m, memory: 128Mi}
            limits: {cpu: '1', memory: 512Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
