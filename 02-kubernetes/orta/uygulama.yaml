apiVersion: v1
kind: ConfigMap
metadata:
  name: go-ayarlar
  namespace: odev
data:
  MESAJ: Kubernetes'ten merhaba
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api
  namespace: odev
spec:
  replicas: 2
  selector:
    matchLabels: {app: go-api}
  template:
    metadata:
      labels: {app: go-api}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: go-odev:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: {name: go-ayarlar}
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 2
            periodSeconds: 3
          livenessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {cpu: 250m, memory: 64Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: go-api
  namespace: odev
spec:
  selector: {app: go-api}
  ports:
    - port: 80
      targetPort: 8080
