apiVersion: v1
kind: Pod
metadata:
  name: merhaba-go
  namespace: odev
  labels:
    app: merhaba-go
spec:
  containers:
    - name: api
      image: go-odev:1.0
      imagePullPolicy: Never
      ports:
        - containerPort: 8080
      resources:
        requests: {cpu: 50m, memory: 32Mi}
        limits: {cpu: 250m, memory: 64Mi}
